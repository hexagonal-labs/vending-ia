[project]
name = "nayax-agents-langgraph"
version = "0.1.0"
description = "Agentes Nayax con LangGraph, MCP y arquitectura limpia."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.0,<2.0",
  "langchain-mcp-adapters>=0.1,<1.0",
  "langchain-openai>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "langgraph-checkpoint-sqlite>=3.0,<4.0",
  "aiosqlite>=0.20,<1.0",
  "httpx>=0.27,<1.0",
  "cryptography>=44,<45",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "pyyaml>=6.0,<7.0",
  "rich>=13.9,<15.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
  "types-PyYAML>=6.0,<7.0",
]
telegram = [
  "python-telegram-bot>=21.0,<23.0",
]
studio = [
  "langgraph-cli[inmem]>=0.4.0,<1.0",
]

[project.scripts]
nayax-chat = "nayax_agents.interfaces.cli.chat:main"
nayax-pricing-report = "nayax_agents.interfaces.cli.pricing_report:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nayax_agents = ["prompts/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
