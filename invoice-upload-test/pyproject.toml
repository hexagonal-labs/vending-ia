[project]
name = "invoice-upload-test"
version = "0.1.0"
description = "Interfaz temporal para cargar facturas a los bridges MCP."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "mcp>=1.0,<2.0",
  "pydantic-settings>=2.4,<3.0",
  "python-multipart>=0.0.18,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<1.0",
]

[project.scripts]
invoice-upload-test = "invoice_upload_test.app:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
