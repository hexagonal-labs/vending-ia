[project]
name = "pricing-catalog-bridge"
version = "0.1.0"
description = "Bridge MCP propietario del catálogo, histórico y Excel de pricing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0,<2.0",
  "pydantic>=2.8,<3.0",
  "rapidfuzz>=3.9,<4.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<1.0",
]

[project.scripts]
pricing-catalog-mcp = "pricing_catalog_bridge.interfaces.mcp_server:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
