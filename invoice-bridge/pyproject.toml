[project]
name="invoice-bridge"
version="0.1.0"
requires-python=">=3.11"
dependencies=["httpx>=0.27,<1.0","mcp>=1.0,<2.0","pydantic>=2.8,<3.0","pypdf>=5.0,<7.0"]
[project.optional-dependencies]
dev=["pytest>=8.3,<9.0","ruff>=0.8,<1.0","mypy>=1.13,<2.0"]
[project.scripts]
invoice-mcp="invoice_bridge.server:main"
[build-system]
requires=["setuptools>=75"]
build-backend="setuptools.build_meta"
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
testpaths=["tests"]
[tool.ruff]
line-length=120
[tool.ruff.lint]
select=["E","F","I","B","UP"]
[tool.mypy]
python_version="3.11"
strict=true
files=["src","tests"]
